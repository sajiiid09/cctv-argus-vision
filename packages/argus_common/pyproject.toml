[project]
name = "argus-common"
version = "0.1.0"
description = "Shared config, clock and small utilities. No vision, no database."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]
