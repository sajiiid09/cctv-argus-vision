[project]
name = "argus-pipelines"
version = "0.1.0"
description = "Pipeline logic: gate, canteen, occupancy, violence (M3+)."
requires-python = ">=3.12"
# argus-payroll is deliberately absent: evidence flows one way, and the
# structural tests enforce it. argus-ingest is absent too -- depending on a
# service would invert the layering, so base.py declares Protocols that
# RTSPSource and ClipStore satisfy structurally instead.
dependencies = ["argus-common", "argus-backends", "argus-store", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]
