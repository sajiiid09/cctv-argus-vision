[project]
name = "argus-backends"
version = "0.1.0"
description = "Inference backends. The ONLY place onnxruntime/torch/vendor SDKs may be imported."
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pyyaml>=6.0"]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.19"]
cuda = ["onnxruntime-gpu>=1.19; sys_platform == 'linux' and platform_machine == 'x86_64'"]
macos = ["onnxruntime>=1.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]
