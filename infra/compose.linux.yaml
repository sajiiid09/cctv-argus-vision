# Linux staging/production (ADR-0016): everything in containers with the
# NVIDIA Container Toolkit. Containers invoke the SAME entrypoint a developer
# runs natively — the container supplies environment, not behaviour (AGENTS.md §5).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
      POSTGRES_DB: argus
    volumes:
      - argus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  ingest:
    build:
      context: ..
      dockerfile: infra/ingest.dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARGUS_DATABASE__DSN: postgresql://argus:argus@postgres:5432/argus
    volumes:
      - ../config:/etc/argus/config:ro
      - ../var/clips:/app/var/clips
      - ../models/artifacts:/app/models/artifacts:ro
    # /dev/shm: the 64 MB default breaks frame passing in confusing ways (§5.8)
    shm_size: "1gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["--config", "/etc/argus/config/staging.yaml"]
    restart: unless-stopped

volumes:
  argus_pgdata:
