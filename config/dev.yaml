# Dev configuration — the same file/env mechanism on every platform (§5.4).
# Camera URIs point at the virtual camera rig (mediamtx on localhost).
timezone: Asia/Dhaka

database:
  dsn: postgresql://argus:argus@localhost:5432/argus

# The console. Passphrases come from config/secrets.env (mode 600) via ${VAR};
# with none set, nobody can log in, which is the safe default (ADR-0028).
ui:
  bind_host: 127.0.0.1
  port: 8080

# The badge reader. Simulated until one exists on a LAN we can reach.
gate:
  tap_source: simulated
  reader_id: gate_reader_01
  camera_id: gate_door

clips:
  dir: var/clips

# Analysis in the ingest process (ADR-0033). Off here: turning it on needs
# model artefacts, and `config/rig_canteen.yaml` is the one that does.
pipelines:
  enabled: false

face:
  enabled: false   # no enrolment and no measured threshold yet (ADR-0010)

ingest:
  stall_timeout_s: 5
  decode: software
  reconnect:
    initial_s: 0.5
    max_s: 10
    jitter: 0.25
  ring_buffer_seconds: 15

cameras:
  - camera_id: canteen_door_01
    role: canteen_door
    space_id: canteen
    door_id: c1
    direction_hint: east
    source_uri: rtsp://localhost:8554/canteen_door_01
    is_virtual: true
    # Fractions of the frame, never pixels (ADR-0031: the analysis substream is
    # a different size). Top-to-bottom line down the middle, matching the rig's
    # door_line_x: 320 on a 640-wide frame; inside is east of it, so a person
    # walking east is entering.
    door_line: [0.5, 0.0, 0.5, 1.0]
    inside_sign: 1
    # 8 fps leaves too little margin for two samples either side of the band at
    # rig walking speed (argus.pipelines.doorway.sampling_is_adequate).
    analysis_fps: 15

  - camera_id: canteen_door_02
    role: canteen_door
    space_id: canteen
    door_id: c2
    direction_hint: west
    source_uri: rtsp://localhost:8554/canteen_door_02
    is_virtual: true
    door_line: [0.5, 0.0, 0.5, 1.0]
    # This door faces the other way: inside is west of the line. One camera per
    # door, one sign per camera -- pairing is per space, so an enter here pairs
    # with an exit at door c1.
    inside_sign: -1
    analysis_fps: 15

  - camera_id: gate_door
    role: gate
    door_id: g1
    source_uri: rtsp://localhost:8554/gate_door
    is_virtual: true

  - camera_id: floor_view
    role: floor
    source_uri: rtsp://localhost:8554/floor_view
    is_virtual: true
