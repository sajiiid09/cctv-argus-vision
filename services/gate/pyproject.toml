[project]
name = "argus-gate"
version = "0.1.0"
description = "Gate attendance: badge taps, 1:1 face verification, review items."
requires-python = ">=3.12"
dependencies = ["argus-common", "argus-store", "argus-pipelines", "argus-backends", "numpy>=1.26"]

[project.scripts]
argus-gate = "argus.gate.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]
