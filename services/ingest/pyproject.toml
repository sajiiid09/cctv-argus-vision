[project]
name = "argus-ingest"
version = "0.1.0"
description = "Stream manager: RTSP ingest, decode, fan-out, ring buffer, gaps, clips."
requires-python = ">=3.12"
dependencies = [
    "argus-common",
    "argus-store",
    "av>=13",
    "numpy>=1.26",
]

[project.scripts]
argus-ingest = "argus.ingest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]
