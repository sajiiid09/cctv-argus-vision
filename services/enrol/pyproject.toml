[project]
name = "argus-enrol"
version = "0.1.0"
description = "Enrolment CLI: people, consent, face templates, badges, purge."
requires-python = ">=3.12"
# av is here to decode enrolment photographs. Reading media is what this does.
dependencies = ["argus-common", "argus-store", "argus-backends", "av>=13", "numpy>=1.26"]

[project.scripts]
argus-enrol = "argus.enrol.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]
